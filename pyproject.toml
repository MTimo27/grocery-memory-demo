[project]
name = "grocery-memory-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery_memory_demo"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
